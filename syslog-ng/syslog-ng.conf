@version: 4.8
@include "scl.conf"

options {
    chain_hostnames(off);
    flush_lines(0);
    use_dns(no);
    use_fqdn(no);
    dns_cache(no);
    owner("root"); group("adm"); perm(0640);
    stats_freq(0);
    threaded(yes);
};

# --- Sources -----------------------------------------------------------

source s_udp {
    network(
        transport("udp")
        port(514)
    );
};

source s_tcp {
    network(
        transport("tcp")
        port(601)
        flags(syslog-protocol)
    );
};

# --- Templates -----------------------------------------------------------

template t_line {
    template("${ISODATE} ${HOST} ${MSGHDR}${MSG}\n");
};

# --- Destinations by vendor ---------------------------------------------

destination d_mikrotik {
    file(
        "/var/log/network/mikrotik.log"
        template(t_line)
        create-dirs(yes)
    );
};

destination d_fortinet {
    file(
        "/var/log/network/fortinet.log"
        template(t_line)
        create-dirs(yes)
    );
};

destination d_cisco {
    file(
        "/var/log/network/cisco.log"
        template(t_line)
        create-dirs(yes)
    );
};

destination d_unknown {
    file(
        "/var/log/network/unknown.log"
        template(t_line)
        create-dirs(yes)
    );
};

# --- Filters (adjust IPs/subnets to your lab) ---------------------------

filter f_mikrotik { netmask(192.168.10.0/24); };   # example: MikroTik mgmt subnet
filter f_fortinet { netmask(192.168.20.0/24); };   # example: Fortinet mgmt subnet
filter f_cisco    { netmask(192.168.30.0/24); };   # example: Cisco mgmt subnet

# --- Log paths -----------------------------------------------------------

log { source(s_udp); source(s_tcp); filter(f_mikrotik); destination(d_mikrotik); };
log { source(s_udp); source(s_tcp); filter(f_fortinet); destination(d_fortinet); };
log { source(s_udp); source(s_tcp); filter(f_cisco);    destination(d_cisco);    };
log { source(s_udp); source(s_tcp); destination(d_unknown); flags(final); };
